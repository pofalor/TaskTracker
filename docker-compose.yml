services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasktracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tasktracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: TaskTracker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-tasktracker};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      Identity__TokenIssuer: ${IDENTITY_TOKEN_ISSUER:?IDENTITY_TOKEN_ISSUER is required}
      Identity__TokenAudience: ${IDENTITY_TOKEN_AUDIENCE:?IDENTITY_TOKEN_AUDIENCE is required}
      Identity__TokenSecret: ${IDENTITY_TOKEN_SECRET:?IDENTITY_TOKEN_SECRET is required}
      TelegramSettings__AdminTelegramIds: ${TELEGRAM_ADMIN_IDS:-}
      TelegramSettings__TelegramBotToken: ${TELEGRAM_BOT_TOKEN:-}
      Security__AnonymousTokenRequest: ${SECURITY_ANONYMOUS_TOKEN_REQUEST:?SECURITY_ANONYMOUS_TOKEN_REQUEST is required}
    ports:
      - "${API_PORT:-8080}:8080"

  ui:
    build:
      context: ./ui/task-tracker
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${UI_PORT:-4200}:80"

volumes:
  postgres-data:
